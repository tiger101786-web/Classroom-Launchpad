<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>Gummy Bear candy colors</title><style>body{background:#29252d;color:#fff;font:16px system-ui;margin:0;padding:26px;text-align:center}h1{font-size:28px;margin:0 0 8px}p{color:#d0bbc9;margin:0 0 22px}main{max-width:1050px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}article{background:#29252d;border:1px solid #685062;border-radius:18px;padding:10px}img{display:block;width:100%}a{color:#ffc1d7}footer{margin-top:20px}@media(max-width:620px){main{grid-template-columns:repeat(2,1fr)}} </style></head><body><h1>Gummy Bear · Candy collection</h1><p>Eight flavors. The same glossy gummy bear.</p><main></main><footer><a href="work/gummy-bear-preview.html">Try the actual animated pet</a></footer><script>for(const name of ['Cherry','Strawberry','Orange','Lemon','Green Apple','Pineapple','Blue Raspberry','Grape']){const card=document.createElement('article'),img=document.createElement('img');img.src='assets/pet-studio/gummy-'+name.toLowerCase().replaceAll(' ','-')+'.png';img.alt=name+' Gummy Bear';card.append(img);document.querySelector('main').append(card)}</script></body></html>
