<!doctype html><html lang="en"><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roblox Buddy — outfits</title><link rel="stylesheet" href="roblox-pet/interactive.css?v=20261025-wardrobe-v3"><style>
body{margin:0;background:#1b2430;color:#eaf4ff;font:16px system-ui;text-align:center}main{max-width:900px;margin:auto;padding:24px}h1{margin-bottom:8px}p{color:#b9cbde}.stage{display:grid;place-items:center;min-height:480px;background:radial-gradient(#374a60,#202c3b);border:1px solid #516075;border-radius:24px;margin:24px 0}.stage .roblox-companion{position:relative!important;inset:auto!important;width:300px!important;max-width:85vw;margin:0}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:16px 0}button,select{padding:10px 14px;border:1px solid #657a92;border-radius:10px;background:#293d53;color:#fff;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#195b8c;border-color:#98d9ff}.roblox-speech{display:none}label{display:flex;align-items:center;gap:8px}.note{font-size:13px}
</style></head><body><main><h1>Roblox Buddy · new outfits</h1><p>The actual Pet Studio outfits, with mix-and-match tops, pants, and headwear.</p><div class="controls" id="skins"></div><div class="stage"></div><div class="controls"><label>Headwear <select id="headwear"><option value="none">None</option><option value="headphones">Headphones</option><option value="hard-hat">Builder hard hat</option><option value="bacon-hair">Bacon hair</option><option value="knight-helmet">Knight helmet</option></select></label><label>Top <select id="top"></select></label><label>Pants <select id="pants"></select></label><label><input id="motion" type="checkbox" checked>Motion</label></div><div class="controls"><button data-action="hello">Say hello</button><button data-action="hands">Arm wiggle</button><button data-action="look">Look around</button><button id="sleep">Sleep / wake</button><button id="dance">Dance</button></div><p class="note">These use the production artwork and animations. This test does not change account settings.</p></main><script src="roblox-pet/skins.js?v=20261025-more-outfits-v4"></script><script src="roblox-pet/interactive.js?v=20261025-nameplate-v4"></script><script>
let prefs={...robloxDefaults(),skin:'Builder',headwear:'hard-hat'},radio=false;const pet=createRobloxPet(p=>{prefs=p;refresh()},()=>pet.play('hello'));document.querySelector('.stage').append(pet.host);
function refresh(){pet.update({account:'skin-preview',visible:true,radio,preferences:prefs});document.querySelector('#headwear').value=prefs.headwear;for(const k of ['top','pants'])document.querySelector('#'+k).value=prefs[k]||'skin';document.querySelectorAll('[data-skin]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.skin===prefs.skin))}
for(const skin of Object.keys(robloxSkins)){const b=document.createElement('button');b.textContent=skin;b.dataset.skin=skin;b.onclick=()=>{prefs.skin=skin;prefs.top=prefs.pants='skin';prefs.headwear=robloxSkins[skin].headwear;refresh()};document.querySelector('#skins').append(b)}
for(const k of ['top','pants']){const select=document.querySelector('#'+k);select.add(new Option('Match skin','skin'));Object.keys(robloxSkins).forEach(id=>select.add(new Option(id,id)));select.onchange=()=>{prefs[k]=select.value;refresh()};}document.querySelector('#headwear').onchange=e=>{prefs.headwear=e.target.value;refresh()};document.querySelector('#motion').onchange=e=>{prefs.motion=e.target.checked;refresh()};document.querySelector('#sleep').onclick=()=>{prefs.asleep=!prefs.asleep;refresh()};document.querySelector('#dance').onclick=()=>{radio=!radio;refresh()};document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>pet.play(b.dataset.action));refresh();window.skinPreview={pet,get prefs(){return prefs},refresh};
</script></body></html>
