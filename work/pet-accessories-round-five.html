<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>Four-pet accessory fitting room</title><link rel="stylesheet" href="companion-picker.css"><link rel="stylesheet" href="robo-colt/interactive.css"><link rel="stylesheet" href="gummy-bear/interactive.css"><link rel="stylesheet" href="eagle-pet/interactive.css"><style>
.stage-slot .robo-companion[data-size] .pet-button{width:100%!important;height:auto!important;aspect-ratio:920/940!important}
.stage-slot .robo-companion[data-size] .pet-button>svg{display:block;width:100%!important;height:auto!important}
*{box-sizing:border-box}body{margin:0;background:#19151e;color:#f8eef4;font:15px 'Segoe UI',sans-serif}header,footer{text-align:center;padding:24px}h1{margin:0 0 8px}p{color:#c8b8c8}.grid{max-width:1200px;margin:auto;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:22px}.card{background:radial-gradient(ellipse at 50% 35%,#493943,#251e29 70%);border:1px solid #684958;border-radius:22px;padding:20px;text-align:center}.card h2{margin:0}.stage-slot{height:360px;display:grid;place-items:center}.stage-slot>.robo-companion,.stage-slot>.dumpling-companion,.stage-slot>.eagle-companion,.stage-slot>.gummy-companion{position:relative!important;inset:auto!important;transform:none!important;margin:auto!important;max-width:100%;z-index:1!important}.stage-slot>.robo-companion{width:290px!important}.stage-slot>.dumpling-companion{width:310px!important}.stage-slot>.eagle-companion{width:355px!important}.stage-slot>.gummy-companion{width:200px!important}.stage-slot .pet-button{width:100%;height:auto;padding:0;background:none;border:0;box-shadow:none;pointer-events:none}.stage-slot svg{width:100%;height:auto;overflow:visible}.stage-slot .stage{background:none;border:0;padding:0;min-height:0;display:block}.stage-slot .panel,.stage-slot [class*="speech"]{display:none!important}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}button,select{font:inherit;color:inherit;border:1px solid #806373;border-radius:9px;background:#352735;padding:9px 12px;cursor:pointer}button[aria-pressed=true]{background:#93294d;border-color:#f4b1cc}button:focus-visible,select:focus-visible{outline:2px solid #ffd2e5;outline-offset:3px}.hint{font-size:12px}label{display:block;margin-top:16px}label select{margin-left:8px}footer{color:#c8b8c8}@media(max-width:740px){.grid{grid-template-columns:1fr;padding:10px}.card{padding:16px}.stage-slot{height:345px}.stage-slot>.eagle-companion{width:300px!important}.stage-slot>.dumpling-companion{width:280px!important}}
</style></head><body><header><h1>Four-pet accessory fitting room</h1><p>Six approved accessories on the actual animated pets. Toggle each piece and try it in motion.</p></header><main class="grid"></main><footer>These six approved accessories are now in Pet Studio.</footer>
<script src="robo-colt/skins.js"></script><script src="robo-colt/accessories.js"></script><script src="robo-colt/nameplate.js"></script><script src="robo-colt/interactive.js"></script><script src="dumpling-pet/interactive.js"></script><script src="dumpling-pet/accessories.js"></script><script src="pet-accessories.js"></script><script src="eagle-pet/interactive.js"></script><script src="gummy-bear/interactive.js"></script><script src="pet-accessories-approved.js"></script><script>
window.fittings={};
const catalog={colt:{name:'Colt · Racing team',items:[['racing-helmet','Racing helmet','head'],['sport-goggles','Sport goggles','eyes'],['chest-badge','Armored badge','body']]},squishy:{name:'Squishy · Tea collection',items:[['tea-glasses','Tea glasses','eyes']]},eagle:{name:'Eagle · Expedition',items:[['bronze-goggles','Bronze goggles','eyes'],['shoulder-scarf','Woven scarf','body']]}};
for(const [kind,entry] of Object.entries(catalog)){
 const card=document.createElement('section');card.className='card';card.id=kind;card.innerHTML='<h2>'+entry.name+'</h2><div class="stage-slot"></div><div class="controls pieces"></div><div class="controls actions"></div><p class="hint">Headwear hides while dancing; your selection returns afterward.</p>';document.querySelector('.grid').append(card);
 let api,host,prefs,dress;
 if(kind==='squishy'){host=document.createElement('div');host.className='dumpling-companion';host.innerHTML='<h1 hidden></h1><div class="eyebrow" hidden></div><section class="stage"><span hidden></span><img class="toy" alt="Squishy dumpling"></section><aside class="panel" hidden><div><h2></h2><p></p></div><div class="note"></div></aside>';card.querySelector('.stage-slot').append(host);api=createDumplingPet(host);dress=addDumplingAccessories(host);prefs={asleep:false};}
 else{api=(kind==='colt'?createRoboColt:kind==='gummy'?createGummyBear:createEaglePet)(()=>{},()=>{});host=api.host||document.querySelector('.robo-companion');prefs=(kind==='colt'?roboColtDefaults:kind==='gummy'?gummyBearDefaults:eaglePetDefaults)();prefs.nameplate=false;card.querySelector('.stage-slot').append(host);}
 const acc={set(ids){if(kind==='squishy'){dress.setEyewear(ids.includes('tea-glasses')?'tea-glasses':'none');return}prefs.headwear=entry.items.find(x=>x[2]==='head'&&ids.includes(x[0]))?.[0]||'none';prefs.eyewear=entry.items.find(x=>x[2]==='eyes'&&ids.includes(x[0]))?.[0]||'none';prefs.neckwear=entry.items.find(x=>x[2]==='body'&&ids.includes(x[0]))?.[0]||'none';api.update({account:'fifth-'+kind,visible:true,radio:state.radio,preferences:prefs});}},state={host,api,prefs,selected:entry.items.map(x=>x[0]),radio:false};fittings[kind]=state;
 state.render=()=>{if(kind==='squishy'){api.setSleep(prefs.asleep);api.setRadio(state.radio)}else api.update({account:'fifth-'+kind,visible:true,radio:state.radio,preferences:prefs});acc.set(state.selected.filter(id=>!(state.radio&&!prefs.asleep&&entry.items.find(x=>x[0]===id)[2]==='head')));card.querySelectorAll('[data-piece]').forEach(b=>b.setAttribute('aria-pressed',state.selected.includes(b.dataset.piece)));card.querySelector('[data-action=dance]')?.setAttribute('aria-pressed',state.radio);card.querySelector('[data-action=sleep]')?.setAttribute('aria-pressed',prefs.asleep);};
 for(const [id,name] of entry.items){const b=document.createElement('button');b.textContent=name;b.dataset.piece=id;b.onclick=()=>{state.selected=state.selected.includes(id)?state.selected.filter(x=>x!==id):[...state.selected,id];state.render()};card.querySelector('.pieces').append(b)}
 for(const [id,label] of [['clear','Clear'],['hello','Say hello'],['move','Move'],['dance','Dance'],['sleep','Sleep / wake']]){const b=document.createElement('button');b.textContent=label;b.dataset.action=id;b.onclick=()=>{if(id==='clear')state.selected=[];if(id==='dance')state.radio=!state.radio;if(id==='sleep')prefs.asleep=!prefs.asleep;state.render();if(id==='hello'||id==='move'){if(kind==='squishy'){if(id==='hello')api.excite();else host.querySelector('[data-motion=squish]').click()}else if(kind==='colt')host.querySelector('[data-setting=action][data-option='+ (id==='hello'?'greet':'hoof')+']')?.click();else api.play(id==='hello'?(kind==='eagle'?'hello':'excited'):(kind==='eagle'?'fast-wings':'squish'));}};card.querySelector('.actions').append(b)}
 if(kind==='colt'||kind==='gummy'){const label=document.createElement('label');label.textContent='Skin';const select=document.createElement('select');Object.keys(kind==='colt'?roboColtSkins:gummyBearSkins).forEach(s=>select.add(new Option(s,s)));select.value=prefs.skin;select.onchange=()=>{prefs.skin=select.value;state.render()};label.append(select);card.append(label)}
 state.render();
}
</script></body></html>
