<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>Labubu outfits · working preview</title>
<link rel="stylesheet" href="labubu-pet/interactive.css"><style>
body{background:#29242b;color:#fff3df;font:16px system-ui;margin:30px}h1{text-align:center}.cards{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}.card{width:320px;border:1px solid #695447;border-radius:20px;padding:20px;text-align:center;background:radial-gradient(ellipse at center,#514437,#28232b)}.stage{height:500px;display:flex;align-items:center;justify-content:center}.card .labubu-companion{position:relative!important;inset:auto!important;width:280px!important;pointer-events:none}.card button,select{font:inherit;background:#5c3943;color:white;border:1px solid #bc8c77;border-radius:8px;padding:8px;margin:4px}header{text-align:center;margin:24px}
</style><h1>Labubu · fitted wardrobe</h1><header><label>Fur color <select id="skin"></select></label></header><main class="cards"></main>
<script src="labubu-pet/skins.js"></script><script src="labubu-pet/accessories.js?v=20261026-scarf-fit-v8"></script><script src="labubu-pet/interactive.js?v=20261025-idle-sleep-v8"></script><script>
window.fittings=[];
const looks=[['Mustard knit','mustard-cap','mustard-overalls','none'],['Black streetwear','black-bucket','black-streetwear','gold-chain'],['Cozy hoodie','black-hood','black-hoodie','none'],['Denim overalls','denim-cap','denim-overalls','none'],['Sage explorer','sage-bucket','sage-jacket','compass'],['Navy varsity','navy-hood','navy-varsity','none'],['Rainy day','teal-hood','teal-raincoat','none'],['Cable knit','berry-beanie','berry-sweater','plaid-scarf'],['Pirate captain','pirate-tricorn','pirate-coat','none'],['Little chef','chef-hat','chef-uniform','chef-kerchief'],['Space explorer','space-helmet','space-suit','none']];
for(const [title,headwear,outfit,neckwear] of looks){const card=document.createElement('section');card.className='card';card.innerHTML='<h2>'+title+'</h2><div class="stage"></div><div class="actions"></div>';document.querySelector('main').append(card);const pet=createLabubuPet(()=>{}),prefs={...labubuDefaults(),headwear,outfit,neckwear,size:'extra-large'},f={pet,prefs,radio:false};f.render=()=>pet.update({account:title,visible:true,radio:f.radio,preferences:prefs});fittings.push(f);card.querySelector('.stage').append(pet.host);f.render();for(const [label,action] of [['Hello','hello'],['Hands','hand'],['Ears','ears'],['Dance','dance'],['Sleep / wake','sleep']]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{if(action==='dance'){f.radio=!f.radio;f.render()}else if(action==='sleep'){prefs.asleep=!prefs.asleep;f.render()}else pet.play(action)};card.querySelector('.actions').append(b)}}
const select=document.querySelector('#skin');for(const skin of Object.keys(labubuSkins))select.add(new Option(skin,skin));select.onchange=()=>fittings.forEach(f=>{f.prefs.skin=select.value;f.render()});
</script></html>
