<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>Painted Colt skins</title><link rel="stylesheet" href="robo-colt/interactive.css"><style>
body{margin:0;background:#29252d;color:#f7f1e9;font:16px system-ui;text-align:center}h1{font-size:24px;margin:22px 0 8px}nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:12px}nav button{padding:9px 18px;border:1px solid #847b8c;border-radius:12px;background:#39323f;color:inherit;cursor:pointer}nav button[aria-pressed=true]{background:#6d3657;border-color:#f6c0dd}.robo-companion{position:relative!important;inset:auto!important;width:440px!important;margin:0 auto!important}.robo-companion .pet-button{width:440px!important;height:560px!important}.robo-companion .panel{display:none!important}p{margin:10px auto;max-width:600px;color:#cec5d0}@media(max-width:480px){.robo-companion{width:100%!important}.robo-companion .pet-button{width:100%!important;height:auto!important;aspect-ratio:920/1170}}
</style></head><body><h1>Custom painted Colt skins</h1><p>Actual production artwork, animations, accessories, and matching nameplate.</p><nav id="skins"></nav><nav><button id="music">Dance / music</button><button id="sleep">Sleep / wake</button><button id="phones">Headphones</button></nav><script src="robo-colt/skins.js"></script><script src="robo-colt/accessories.js"></script><script src="robo-colt/nameplate.js"></script><script src="robo-colt/interactive.js"></script><script>
const api=createRoboColt(()=>{});let skin='Jack-o-Lantern',radio=false,asleep=false,phones=false;
window.showPaintedSkin=function(value){skin=value;render()};
function render(){api.update({account:'painted-preview',visible:true,radio,preferences:{...roboColtDefaults(),skin,name:skin,asleep,headwear:phones?'headphones':'none'}});document.querySelectorAll('#skins button').forEach(b=>b.setAttribute('aria-pressed',b.textContent===skin));}
for(const name of ['Camo','Rainbow','Crocodile','Tiger','Zebra','Panda','Snake','Glitter','Jack-o-Lantern']){const b=document.createElement('button');b.textContent=name;b.onclick=()=>showPaintedSkin(name);document.querySelector('#skins').append(b)}
const wagButton=document.createElement('button');wagButton.textContent='Tail wag';wagButton.onclick=()=>document.querySelector('[data-setting="action"][data-option="tail"]').click();document.querySelector('#music').parentElement.append(wagButton);
document.querySelector('#music').onclick=()=>{radio=!radio;render()};document.querySelector('#sleep').onclick=()=>{asleep=!asleep;render()};document.querySelector('#phones').onclick=()=>{phones=!phones;render()};render();
</script></body></html>
