<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>Gummy Bear — actual pet</title><link rel="stylesheet" href="gummy-bear/interactive.css"><style>body{margin:0;background:#29252d;color:#fff;font:16px system-ui;text-align:center}h1{margin:22px 0 5px}p{color:#ddd}nav{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:10px}button{font:inherit;color:inherit;background:#443342;border:1px solid #866379;border-radius:10px;padding:8px 15px;cursor:pointer}button[aria-pressed=true]{background:#983754}.gummy-companion{position:relative!important;inset:auto!important;margin:auto;width:310px!important;max-width:90vw}#gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:1050px;margin:25px auto;padding:12px}#gallery img{width:100%}@media(max-width:600px){#gallery{grid-template-columns:repeat(2,1fr)}}</style></head><body><h1>Gummy Bear</h1><p>The actual pet artwork, candy colors, and animations.</p><nav id="flavors"></nav><nav><button id="dance">Dance</button><button id="sleep">Sleep / wake</button><button id="squish">Jelly wobble</button><button id="blink">Blink</button><button id="mouth">Mouth movement</button><button id="ears">Ear wobble</button></nav><script src="gummy-bear/interactive.js"></script><script>let prefs=gummyBearDefaults(),radio=false;const api=createGummyBear(p=>{prefs=p;render()},()=>api.play('excited'));function render(){api.update({account:'preview',visible:true,radio,preferences:prefs});document.querySelectorAll('[data-flavor]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.flavor===prefs.skin))}window.showGummy=(skin,motion=true)=>{prefs={...prefs,skin,motion,name:skin,asleep:false};radio=false;render()};for(const skin of Object.keys(gummyBearSkins)){const b=document.createElement('button');b.textContent=skin;b.dataset.flavor=skin;b.onclick=()=>showGummy(skin);document.querySelector('#flavors').append(b)}document.querySelector('#dance').onclick=()=>{radio=!radio;render()};document.querySelector('#sleep').onclick=()=>{prefs.asleep=!prefs.asleep;render()};document.querySelector('#squish').onclick=()=>api.play('squish');document.querySelector('#blink').onclick=()=>api.play('blink');document.querySelector('#mouth').onclick=()=>api.play('mouth');document.querySelector('#ears').onclick=()=>api.play('ears');render();</script><section id="gallery"></section></body></html>
